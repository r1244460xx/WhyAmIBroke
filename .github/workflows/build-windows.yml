name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Package with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --noconfirm --onedir --console `
          --name "CreditCardAnalysis" `
          --add-data "app.py;." `
          --add-data "src;src" `
          --collect-all streamlit `
          --collect-all plotly `
          --collect-all pdfplumber `
          --collect-all pypdf `
          --copy-metadata streamlit `
          entrypoint.py

    - name: Assemble distribution package
      shell: bash
      run: |
        mkdir -p dist/CreditCardAnalysis/bills
        cp config.example.json dist/CreditCardAnalysis/config.example.json
        cp config.example.json dist/CreditCardAnalysis/config.json
        cd dist
        7z a -tzip CreditCardAnalysis-Windows.zip CreditCardAnalysis

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreditCardAnalysis-Windows
        path: dist/CreditCardAnalysis-Windows.zip
        retention-days: 30
